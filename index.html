
<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEON RACE</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    user-select: none;
}

body {
    overflow: hidden;
    font-family: Arial, sans-serif;
    background: #050509;
    color: white;
}

/* GAME */
#game {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: linear-gradient(#09091a, #111);
}

/* ROAD */
#road {
    position: absolute;
    width: 430px;
    max-width: 100vw;
    height: 100%;
    left: 50%;
    transform: translateX(-50%);
    background:
        linear-gradient(
            90deg,
            #171717 0%,
            #242424 5%,
            #292929 50%,
            #242424 95%,
            #171717 100%
        );
    border-left: 7px solid #00eaff;
    border-right: 7px solid #ff00d4;
}

/* ROAD LINES */
.line {
    position: absolute;
    width: 8px;
    height: 70px;
    background: white;
    left: 33.33%;
    transform: translateX(-50%);
    box-shadow: 0 0 12px white;
}

.line.right {
    left: 66.66%;
}

/* HUD */
#hud {
    position: absolute;
    top: 15px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 20;
    width: min(90%, 600px);

    display: flex;
    justify-content: space-between;
    gap: 10px;
}

.hud-box {
    background: rgba(0,0,0,.65);
    border: 1px solid #00eaff;
    padding: 10px 15px;
    border-radius: 12px;
    box-shadow: 0 0 15px rgba(0,234,255,.25);
    font-weight: bold;
}

/* PLAYER */
.car {
    position: absolute;
    width: 58px;
    height: 105px;
    border-radius: 16px 16px 10px 10px;
    z-index: 10;
}

#player {
    bottom: 40px;
    left: 50%;
    transform: translateX(-50%);
    background:
        linear-gradient(
            90deg,
            #b900ff,
            #ff008c,
            #b900ff
        );
    box-shadow:
        0 0 15px #ff00b7,
        0 0 35px #ff00b7;
}

/* CAR DETAILS */
.car::before {
    content: "";
    position: absolute;
    top: 13px;
    left: 9px;
    width: 40px;
    height: 30px;
    border-radius: 8px;
    background: linear-gradient(#bdfaff, #087f9b);
    border: 2px solid #111;
}

.car::after {
    content: "";
    position: absolute;
    bottom: 12px;
    left: 12px;
    width: 34px;
    height: 10px;
    border-radius: 5px;
    background: #fff;
    box-shadow: 0 0 10px white;
}

/* ENEMY */
.enemy {
    position: absolute;
    width: 58px;
    height: 105px;
    border-radius: 16px 16px 10px 10px;
    z-index: 8;
    background: linear-gradient(
        90deg,
        #ff1616,
        #ff7300,
        #ff1616
    );
    box-shadow:
        0 0 15px #ff2500,
        0 0 30px rgba(255,0,0,.5);
}

.enemy::before {
    content: "";
    position: absolute;
    top: 13px;
    left: 9px;
    width: 40px;
    height: 30px;
    border-radius: 8px;
    background: #222;
    border: 2px solid #111;
}

.enemy::after {
    content: "";
    position: absolute;
    bottom: 12px;
    left: 12px;
    width: 34px;
    height: 10px;
    background: #ff2020;
    box-shadow: 0 0 10px red;
}

/* COIN */
.coin {
    position: absolute;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: radial-gradient(circle, #fff47a, #ffc400);
    border: 3px solid #fff;
    box-shadow:
        0 0 10px #ffd000,
        0 0 25px #ffb700;
    z-index: 7;

    display: flex;
    justify-content: center;
    align-items: center;

    color: #8b5900;
    font-weight: bold;
    font-size: 18px;
}

/* START SCREEN */
#startScreen,
#gameOver {
    position: absolute;
    inset: 0;
    z-index: 100;

    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;

    background:
        radial-gradient(circle, #17204b, #050509 70%);
}

#gameOver {
    display: none;
}

.title {
    font-size: clamp(45px, 9vw, 90px);
    font-weight: 900;
    color: #00eaff;
    text-shadow:
        0 0 10px #00eaff,
        0 0 30px #0077ff;
    margin-bottom: 10px;
}

.subtitle {
    color: #ddd;
    margin-bottom: 30px;
}

button {
    border: none;
    cursor: pointer;
    padding: 15px 35px;
    border-radius: 50px;

    background: linear-gradient(
        90deg,
        #00eaff,
        #006eff
    );

    color: white;
    font-size: 18px;
    font-weight: bold;

    box-shadow: 0 0 25px rgba(0,200,255,.6);
    transition: .2s;
}

button:hover {
    transform: scale(1.08);
}

.controls {
    margin-top: 25px;
    color: #aaa;
    line-height: 1.8;
}

/* MOBILE CONTROLS */
#mobileControls {
    position: absolute;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 50;

    display: flex;
    gap: 25px;
}

.controlBtn {
    width: 65px;
    height: 65px;
    border-radius: 50%;

    background: rgba(0,0,0,.65);
    border: 2px solid #00eaff;

    display: flex;
    justify-content: center;
    align-items: center;

    font-size: 28px;
    color: white;
}

.controlBtn:active {
    transform: scale(.9);
}

/* RESPONSIVE */
@media (max-width: 600px) {
    #road {
        width: 100%;
    }

    .car,
    .enemy {
        width: 52px;
        height: 95px;
    }

    #hud {
        font-size: 13px;
    }
}
</style>
</head>

<body>

<div id="game">

    <div id="road"></div>

    <div id="hud">
        <div class="hud-box">
            🏆 <span id="score">0</span>
        </div>

        <div class="hud-box">
            🪙 <span id="coins">0</span>
        </div>

        <div class="hud-box">
            ❤️ <span id="lives">3</span>
        </div>

        <div class="hud-box">
            ⚡ <span id="speed">1</span>
        </div>
    </div>

    <div id="player" class="car"></div>

    <div id="mobileControls">
        <div class="controlBtn" id="leftBtn">⬅</div>
        <div class="controlBtn" id="rightBtn">➡</div>
    </div>

    <!-- START -->
    <div id="startScreen">
        <div class="title">NEON RACE</div>

        <div class="subtitle">
            🚗 Yo‘lni egalla. To‘siqlardan qoch. Rekordni yangila!
        </div>

        <button id="startBtn">
            ▶ O‘YINNI BOSHLASH
        </button>

        <div class="controls">
            ⌨️ Klaviatura: ← → yoki A / D<br>
            📱 Telefonda: ekrandagi tugmalar
        </div>
    </div>

    <!-- GAME OVER -->
    <div id="gameOver">

        <div class="title" style="color:#ff2855;">
            GAME OVER
        </div>

        <p style="font-size:20px;margin-bottom:10px;">
            Natijangiz:
        </p>

        <h2 id="finalScore" style="font-size:40px;">
            0
        </h2>

        <p style="margin:10px 0 25px;">
            🏆 Rekord: <span id="highScore">0</span>
        </p>

        <button id="restartBtn">
            🔄 QAYTA O‘YNASH
        </button>

    </div>

</div>

<script>

/* =========================
   GAME VARIABLES
========================= */

const game = document.getElementById("game");
const road = document.getElementById("road");
const player = document.getElementById("player");

const scoreText = document.getElementById("score");
const coinsText = document.getElementById("coins");
const livesText = document.getElementById("lives");
const speedText = document.getElementById("speed");

const startScreen = document.getElementById("startScreen");
const gameOverScreen = document.getElementById("gameOver");

const finalScore = document.getElementById("finalScore");
const highScoreText = document.getElementById("highScore");

const startBtn = document.getElementById("startBtn");
const restartBtn = document.getElementById("restartBtn");

const leftBtn = document.getElementById("leftBtn");
const rightBtn = document.getElementById("rightBtn");

let gameRunning = false;

let score = 0;
let coins = 0;
let lives = 3;

let speed = 5;

let playerX = 0;

let enemies = [];
let coinObjects = [];
let roadLines = [];

let animationId;

let lastEnemyTime = 0;
let lastCoinTime = 0;


/* =========================
   HIGH SCORE
========================= */

let highScore =
    Number(localStorage.getItem("neonRaceHighScore")) || 0;


/* =========================
   ROAD LINES
========================= */

function createRoadLines() {

    for (let i = 0; i < 8; i++) {

        const line = document.createElement("div");

        line.className = "line";

        line.style.top = (i * 110) + "px";

        road.appendChild(line);

        roadLines.push(line);
    }
}


/* =========================
   PLAYER POSITION
========================= */

function resetPlayer() {

    playerX =
        (road.clientWidth - player.offsetWidth) / 2;

    player.style.left = playerX + "px";
    player.style.transform = "none";
}


/* =========================
   MOVE PLAYER
========================= */

function movePlayer(direction) {

    if (!gameRunning) return;

    const step = 30;

    playerX += direction * step;

    const minX = 10;

    const maxX =
        road.clientWidth -
        player.offsetWidth -
        10;

    if (playerX < minX)
        playerX = minX;

    if (playerX > maxX)
        playerX = maxX;

    player.style.left = playerX + "px";
}


/* =========================
   KEYBOARD
========================= */

document.addEventListener("keydown", function(e) {

    if (e.key === "ArrowLeft" || e.key.toLowerCase() === "a") {
        movePlayer(-1);
    }

    if (e.key === "ArrowRight" || e.key.toLowerCase() === "d") {
        movePlayer(1);
    }
});


/* =========================
   MOBILE BUTTONS
========================= */

leftBtn.addEventListener("pointerdown", () => {
    movePlayer(-1);
});

rightBtn.addEventListener("pointerdown", () => {
    movePlayer(1);
});


/* =========================
   CREATE ENEMY
========================= */

function createEnemy() {

    const enemy = document.createElement("div");

    enemy.className = "enemy";

    const maxX =
        road.clientWidth -
        enemy.offsetWidth -
        10;

    const x =
        Math.random() * maxX;

    enemy.style.left = x + "px";

    enemy.style.top = "-120px";

    road.appendChild(enemy);

    enemies.push(enemy);
}


/* =========================
   CREATE COIN
========================= */

function createCoin() {

    const coin = document.createElement("div");

    coin.className = "coin";

    coin.innerHTML = "$";

    const maxX =
        road.clientWidth -
        40;

    coin.style.left =
        (Math.random() * maxX) + "px";

    coin.style.top = "-50px";

    road.appendChild(coin);

    coinObjects.push(coin);
}


/* =========================
   COLLISION
========================= */

function isColliding(a, b) {

    const rectA = a.getBoundingClientRect();
    const rectB = b.getBoundingClientRect();

    return !(
        rectA.bottom < rectB.top ||
        rectA.top > rectB.bottom ||
        rectA.right < rectB.left ||
        rectA.left > rectB.right
    );
}


/* =========================
   UPDATE ROAD
========================= */

function updateRoad() {

    roadLines.forEach(line => {

        let y =
            parseFloat(line.style.top);

        y += speed;

        if (y > window.innerHeight) {
            y = -80;
        }

        line.style.top = y + "px";
    });
}


/* =========================
   UPDATE ENEMIES
========================= */

function updateEnemies() {

    for (let i = enemies.length - 1; i >= 0; i--) {

        const enemy = enemies[i];

        let y =
            parseFloat(enemy.style.top);

        y += speed;

        enemy.style.top = y + "px";


        /* collision */

        if (isColliding(player, enemy)) {

            enemy.remove();

            enemies.splice(i, 1);

            lives--;

            livesText.textContent = lives;

            if (lives <= 0) {
                endGame();
                return;
            }

            continue;
        }


        /* remove */

        if (y > window.innerHeight + 150) {

            enemy.remove();

            enemies.splice(i, 1);

            score += 10;

            scoreText.textContent = score;
        }
    }
}


/* =========================
   UPDATE COINS
========================= */

function updateCoins() {

    for (
        let i = coinObjects.length - 1;
        i >= 0;
        i--
    ) {

        const coin = coinObjects[i];

        let y =
            parseFloat(coin.style.top);

        y += speed;

        coin.style.top = y + "px";


        if (isColliding(player, coin)) {

            coin.remove();

            coinObjects.splice(i, 1);

            coins++;

            score += 25;

            coinsText.textContent = coins;
            scoreText.textContent = score;

            continue;
        }


        if (y > window.innerHeight + 100) {

            coin.remove();

            coinObjects.splice(i, 1);
        }
    }
}


/* =========================
   DIFFICULTY
========================= */

function increaseDifficulty() {

    const newSpeed =
        5 + Math.floor(score / 100);

    speed = Math.min(newSpeed, 14);

    speedText.textContent =
        Math.round(speed - 4);
}


/* =========================
   GAME LOOP
========================= */

function gameLoop(timestamp) {

    if (!gameRunning) return;


    updateRoad();
    updateEnemies();
    updateCoins();

    increaseDifficulty();


    /* enemy spawn */

    if (timestamp - lastEnemyTime > 900) {

        createEnemy();

        lastEnemyTime = timestamp;
    }


    /* coin spawn */

    if (timestamp - lastCoinTime > 1500) {

        createCoin();

        lastCoinTime = timestamp;
    }


    animationId =
        requestAnimationFrame(gameLoop);
}


/* =========================
   START GAME
========================= */

function startGame() {

    enemies.forEach(e => e.remove());
    coinObjects.forEach(c => c.remove());

    enemies = [];
    coinObjects = [];

    score = 0;
    coins = 0;
    lives = 3;
    speed = 5;

    scoreText.textContent = "0";
    coinsText.textContent = "0";
    livesText.textContent = "3";
    speedText.textContent = "1";

    resetPlayer();

    gameRunning = true;

    startScreen.style.display = "none";
    gameOverScreen.style.display = "none";

    lastEnemyTime = performance.now();
    lastCoinTime = performance.now();

    cancelAnimationFrame(animationId);

    animationId =
        requestAnimationFrame(gameLoop);
}


/* =========================
   GAME OVER
========================= */

function endGame() {

    gameRunning = false;

    cancelAnimationFrame(animationId);

    finalScore.textContent = score;

    if (score > highScore) {

        highScore = score;

        localStorage.setItem(
            "neonRaceHighScore",
            highScore
        );
    }

    highScoreText.textContent = highScore;

    gameOverScreen.style.display = "flex";
}


/* =========================
   BUTTONS
========================= */

startBtn.addEventListener(
    "click",
    startGame
);

restartBtn.addEventListener(
    "click",
    startGame
);


/* =========================
   INIT
========================= */

createRoadLines();

resetPlayer();

highScoreText.textContent = highScore;


/* =========================
   RESIZE
========================= */

window.addEventListener("resize", () => {

    if (gameRunning) {
        resetPlayer();
    }

});

</script>

</body>
</html>
